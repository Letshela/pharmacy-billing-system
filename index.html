<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heleni Pharmacy - Appointment Booker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f0f4ff;padding:20px}
.header{background:#6a1b9a;color:white;padding:25px;border-radius:15px;text-align:center;margin-bottom:20px}
.header h1{font-size:28px}
.header p{opacity:.9;margin-top:5px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:20px}
.card{background:white;padding:20px;border-radius:12px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.card h3{font-size:13px;color:#666}
.card p{font-size:28px;font-weight:bold;color:#6a1b9a;margin-top:5px}
.form{background:white;padding:20px;border-radius:12px;margin-bottom:20px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.form h2{margin-bottom:15px;color:#333}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:15px}
button{padding:12px 20px;border:none;border-radius:8px;font-size:15px;cursor:pointer;font-weight:bold}
.btn-add{background:#6a1b9a;color:white;width:100%;margin-top:12px}
.search{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-bottom:15px}
.list{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.item{display:flex;justify-content:space-between;align-items:center;padding:15px;border-bottom:1px solid #eee;flex-wrap:wrap;gap:10px}
.item b{font-size:16px}
.item small{color:#666;display:block;margin-top:3px}
.badge{padding:5px 10px;border-radius:20px;font-size:12px;font-weight:bold}
.upcoming{background:#e3f2fd;color:#1565c0}
.completed{background:#e8f5e9;color:#2e7d32}
.cancelled{background:#ffebee;color:#c62828}
.btn-done{background:#2e7d32;color:white;padding:8px 12px}
.btn-cancel{background:#ff9800;color:white;padding:8px 12px}
.btn-del{background:#e53935;color:white;padding:8px 12px}
.footer{text-align:center;color:#888;margin-top:20px;font-size:13px}
@media(max-width:600px){.cards{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
<h1>💜 Heleni Pharmacy</h1>
<p>Patient Appointment Booker</p>
</div>

<div class="cards">
<div class="card"><h3>TOTAL APPOINTMENTS</h3><p id="total">0</p></div>
<div class="card"><h3>UPCOMING</h3><p id="upcomingCount">0</p></div>
<div class="card"><h3>COMPLETED TODAY</h3><p id="doneCount">0</p></div>
</div>

<div class="form">
<h2>📅 Book New Appointment</h2>
<div class="form-grid">
<input id="pName" placeholder="Patient Full Name *">
<input id="pPhone" placeholder="Phone Number *">
<select id="pService">
<option>General Consultation</option>
<option>Vaccination</option>
<option>Blood Pressure Check</option>
<option>Diabetes Screening</option>
<option>Prescription Collection</option>
<option>Pharmacist Advice</option>
</select>
<input id="pDate" type="date">
<input id="pTime" type="time">
<input id="pNotes" placeholder="Notes (optional)">
</div>
<button class="btn-add" onclick="addAppt()">+ Book Appointment</button>
</div>

<input class="search" id="search" placeholder="🔍 Search by patient name..." oninput="render()">

<div class="list">
<h2>📋 Appointments List</h2>
<div id="list"></div>
</div>

<div class="footer">Built by Letshela Mahlakola | Technical Project Manager & Software Engineer | JavaScript, HTML, CSS</div>

<script>
let appointments = [
{name:"Thandi Mokoena",phone:"082 123 4567",service:"Vaccination",date:"2026-11-10",time:"09:00",notes:"Flu vaccine",status:"upcoming"},
{name:"Sipho Dlamini",phone:"083 987 6543",service:"Blood Pressure Check",date:"2026-11-10",time:"10:30",notes:"",status:"upcoming"},
{name:"Naledi Khumalo",phone:"084 555 1122",service:"General Consultation",date:"2026-11-09",time:"14:00",notes:"Headache",status:"completed"},
{name:"Kabelo Peters",phone:"081 222 3344",service:"Prescription Collection",date:"2026-11-11",time:"11:00",notes:"",status:"upcoming"},
];

function render(){
let q = document.getElementById('search').value.toLowerCase();
let filtered = appointments.filter(a=>a.name.toLowerCase().includes(q));
document.getElementById('total').textContent = appointments.length;
document.getElementById('upcomingCount').textContent = appointments.filter(a=>a.status==='upcoming').length;
document.getElementById('doneCount').textContent = appointments.filter(a=>a.status==='completed').length;
let html = "";
if(filtered.length===0) html = "<p style='padding:20px;text-align:center;color:#888'>No appointments found.</p>";
filtered.forEach((a,i)=>{
let idx = appointments.indexOf(a);
let badge = a.status==='upcoming' ? '<span class="badge upcoming">UPCOMING</span>' : a.status==='completed' ? '<span class="badge completed">COMPLETED</span>' : '<span class="badge cancelled">CANCELLED</span>';
html += `<div class="item"><div><b>${a.name}</b><small>📞 ${a.phone} | ${a.service}</small><small>📅 ${a.date} at ${a.time} ${a.notes ? '| 📝 '+a.notes : ''}</small></div><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${badge} ${a.status==='upcoming' ? `<button class="btn-done" onclick="markDone(${idx})">Done</button><button class="btn-cancel" onclick="markCancel(${idx})">Cancel</button>` : ''} <button class="btn-del" onclick="del(${idx})">Delete</button></div></div>`;
});
document.getElementById('list').innerHTML = html;
}
function addAppt(){
let n=document.getElementById('pName').value.trim();
let ph=document.getElementById('pPhone').value.trim();
let s=document.getElementById('pService').value;
let d=document.getElementById('pDate').value;
let t=document.getElementById('pTime').value;
let notes=document.getElementById('pNotes').value.trim();
if(!n||!ph||!d||!t){alert("Please fill Name, Phone, Date and Time");return;}
appointments.unshift({name:n,phone:ph,service:s,date:d,time:t,notes:notes,status:"upcoming"});
document.getElementById('pName').value="";document.getElementById('pPhone').value="";document.getElementById('pDate').value="";document.getElementById('pTime').value="";document.getElementById('pNotes').value="";
render(); alert("Appointment booked for "+n+"!");
}
function markDone(i){appointments[i].status="completed";render();}
function markCancel(i){appointments[i].status="cancelled";render();}
function del(i){if(confirm("Delete appointment for "+appointments[i].name+"?")){appointments.splice(i,1);render();}}
render();
</script>
</body>
</html>
